<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fullscreen DVD Screensaver</title>
  <style>
    html, body {
      margin: 0; padding: 0;
      width: 100%; height: 100%;
      background: black; overflow: hidden;
      position: relative;
    }
    /* Hide mouse cursor once in fullscreen */
    :fullscreen, :-webkit-full-screen {
      cursor: none;
    }
    #startBtn {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      padding: 1rem 2rem;
      font-size: 1.2rem;
      cursor: pointer;
      background: #fff;
      color: #000;
      border: none;
      border-radius: 4px;
      z-index: 1000;
    }
    img#dvdLogo {
      position: absolute;
      width: 200px;
      height: 100px;
      will-change: transform;
    }
  </style>
</head>
<body>
  <button id="startBtn">Start Screensaver</button>
  <script>
    const winW = 200;
    const winH = 100;
    let x = 0;
    let y = 0;
    let dx = 15;
    let dy = 15;
    let logo;

    document.getElementById('startBtn').addEventListener('click', async () => {
      // Hide the button
      document.getElementById('startBtn').style.display = 'none';

      // Enter fullscreen and hide cursor
      if (document.documentElement.requestFullscreen) {
        await document.documentElement.requestFullscreen();
      } else if (document.documentElement.webkitRequestFullscreen) {
        await document.documentElement.webkitRequestFullscreen();
      }
      document.body.style.cursor = 'none';

      // Create the DVD logo
      logo = document.createElement('img');
      logo.id = 'dvdLogo';
      logo.src = 'dvd-logo.png';
      logo.style.left = x + 'px';
      logo.style.top = y + 'px';
      document.body.appendChild(logo);

      // Animate
      setInterval(() => {
        x += dx;
        y += dy;
        const maxX = window.innerWidth - winW;
        const maxY = window.innerHeight - winH;
        if (x <= 0 || x >= maxX) dx = -dx;
        if (y <= 0 || y >= maxY) dy = -dy;
        logo.style.transform = `translate(${x}px, ${y}px)`;
      }, 60);
    });
  </script>
</body>
</html>
